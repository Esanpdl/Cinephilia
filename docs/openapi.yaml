openapi: 3.0.3
info:
  title: Cinephilia Core API
  version: 1.0.0
  description: Session-authenticated API. First GET /api/v1/users/csrf/, then send
    X-CSRFToken on writes. Swagger adds the CSRF cookie automatically. Use returned
    tokens after login/register rotation. All movie IDs are TMDB IDs. User-owned data
    is private.
paths:
  /api/v1/admin-panel/stats/:
    get:
      operationId: v1_admin_panel_stats_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
          description: ''
  /api/v1/admin-panel/users/:
    get:
      operationId: v1_admin_panel_users_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserListItemList'
          description: ''
  /api/v1/admin-panel/users/{user_id}/delete/:
    delete:
      operationId: v1_admin_panel_users_delete_destroy
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin-panel/users/{user_id}/demote/:
    post:
      operationId: v1_admin_panel_users_demote_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListItem'
          description: ''
  /api/v1/admin-panel/users/{user_id}/promote/:
    post:
      operationId: v1_admin_panel_users_promote_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListItem'
          description: ''
  /api/v1/admin-panel/users/create-admin/:
    post:
      operationId: v1_admin_panel_users_create_admin_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdmin'
          description: ''
  /api/v1/cinematography/cards/:
    get:
      operationId: v1_cinematography_cards_list
      parameters:
      - in: query
        name: color_mode
        schema:
          enum:
          - color
          - black_and_white
          - mixed
          type: string
          minLength: 1
        description: |-
          * `color` - color
          * `black_and_white` - black_and_white
          * `mixed` - mixed
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 150
      - in: query
        name: status
        schema:
          enum:
          - ready
          - review
          - missing
          - failed
          type: string
          minLength: 1
        description: |-
          * `ready` - ready
          * `review` - review
          * `missing` - missing
          * `failed` - failed
      - in: query
        name: technique
        schema:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCardList'
          description: ''
  /api/v1/cinematography/compare/:
    get:
      operationId: v1_cinematography_compare_retrieve
      parameters:
      - in: query
        name: left
        schema:
          type: integer
          minimum: 1
        required: true
      - in: query
        name: right
        schema:
          type: integer
          minimum: 1
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/cinematography/films/:
    get:
      operationId: v1_cinematography_films_list
      parameters:
      - in: query
        name: color_mode
        schema:
          enum:
          - color
          - black_and_white
          - mixed
          type: string
          minLength: 1
        description: |-
          * `color` - color
          * `black_and_white` - black_and_white
          * `mixed` - mixed
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 150
      - in: query
        name: status
        schema:
          enum:
          - ready
          - review
          - missing
          - failed
          type: string
          minLength: 1
        description: |-
          * `ready` - ready
          * `review` - review
          * `missing` - missing
          * `failed` - failed
      - in: query
        name: technique
        schema:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnalysisSummaryList'
          description: ''
  /api/v1/cinematography/films/{tmdb_id}/:
    get:
      operationId: v1_cinematography_films_retrieve
      parameters:
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisDetail'
          description: ''
  /api/v1/cinematography/films/{tmdb_id}/similar/:
    get:
      operationId: v1_cinematography_films_similar_retrieve
      parameters:
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/cinematography/films/{tmdb_id}/tags/:
    get:
      operationId: v1_cinematography_films_tags_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTagList'
          description: ''
  /api/v1/cinematography/frames/{tmdb_id}/{digest}/{filename}:
    get:
      operationId: v1_cinematography_frames_retrieve
      parameters:
      - in: path
        name: digest
        schema:
          type: string
        required: true
      - in: path
        name: filename
        schema:
          type: string
        required: true
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/cinematography/moderation/:
    get:
      operationId: v1_cinematography_moderation_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTagList'
          description: ''
  /api/v1/cinematography/moderation/{id}/:
    patch:
      operationId: v1_cinematography_moderation_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedModerationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedModerationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedModerationRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
  /api/v1/cinematography/overview/:
    get:
      operationId: v1_cinematography_overview_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/cinematography/quiz/:
    get:
      operationId: v1_cinematography_quiz_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: v1_cinematography_quiz_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizAnswerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuizAnswerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuizAnswerRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/cinematography/spotlight/:
    get:
      operationId: v1_cinematography_spotlight_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/cinematography/tags/:
    get:
      operationId: v1_cinematography_tags_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTagList'
          description: ''
    post:
      operationId: v1_cinematography_tags_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TagWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TagWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
  /api/v1/cinematography/techniques/:
    get:
      operationId: v1_cinematography_techniques_list
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Technique'
          description: ''
  /api/v1/movies/:
    get:
      operationId: v1_movies_list
      parameters:
      - in: query
        name: genre
        schema:
          type: integer
          minimum: 1
        description: TMDB genre ID.
      - in: query
        name: homepage
        schema:
          type: boolean
        description: Only approved scraped/requested films with at least 200 TMDB
          votes.
      - in: query
        name: ordering
        schema:
          enum:
          - rating
          - popularity
          - newest
          - title
          type: string
          default: rating
          minLength: 1
        description: |-
          * `rating` - rating
          * `popularity` - popularity
          * `newest` - newest
          * `title` - title
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 60
          minimum: 1
          default: 20
      - in: query
        name: q
        schema:
          type: string
          maxLength: 200
        description: Search title, director or actor. Title matches rank first, then
          directors, then actors; ordering breaks ties within each group.
      - in: query
        name: theme
        schema:
          enum:
          - drama
          - horror
          - animation
          - blackwhite
          - international
          type: string
          minLength: 1
        description: |-
          * `drama` - drama
          * `horror` - horror
          * `animation` - animation
          * `blackwhite` - blackwhite
          * `international` - international
      - in: query
        name: year
        schema:
          type: integer
          minimum: 1895
        description: Exact release year; 1895 through the current year. Cannot combine
          with a range.
      - in: query
        name: year_from
        schema:
          type: integer
          minimum: 1895
        description: Inclusive first release year; defaults to 1895 when only year_to
          is supplied.
      - in: query
        name: year_to
        schema:
          type: integer
          minimum: 1895
        description: Inclusive last release year; defaults to the current year when
          only year_from is supplied.
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMovieSummaryList'
          description: ''
  /api/v1/movies/{tmdb_id}/:
    get:
      operationId: v1_movies_retrieve
      parameters:
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
          description: ''
  /api/v1/movies/featured/:
    get:
      operationId: v1_movies_featured_retrieve
      description: Return a randomly selected film from the 500 films selected for
        film analysis on each refresh.
      parameters:
      - in: query
        name: seed
        schema:
          type: string
          maxLength: 128
        description: Deterministic seed for repeatable selection.
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
          description: ''
  /api/v1/movies/genres/:
    get:
      operationId: v1_movies_genres_list
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Genre'
          description: ''
  /api/v1/ratings/:
    get:
      operationId: v1_ratings_list
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 60
          minimum: 1
          default: 20
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRatingList'
          description: ''
  /api/v1/ratings/{tmdb_id}/:
    get:
      operationId: v1_ratings_retrieve
      parameters:
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
          description: ''
    put:
      operationId: v1_ratings_update
      description: Create or replace your 1-10 rating using a TMDB movie ID. The session
        determines the owner.
      parameters:
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RatingWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RatingWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
          description: ''
    delete:
      operationId: v1_ratings_destroy
      parameters:
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/ratings/reviews/{tmdb_id}/:
    get:
      operationId: v1_ratings_reviews_list
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 60
          minimum: 1
          default: 20
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewList'
          description: ''
  /api/v1/ratings/reviews/{tmdb_id}/mine/:
    get:
      operationId: v1_ratings_reviews_mine_retrieve
      parameters:
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedReview'
          description: ''
    put:
      operationId: v1_ratings_reviews_mine_update
      description: 'Create or edit your single film review. Stars: 0.5–5 in 0.5 steps.
        Text: 10–3000 characters, no links or repeated text across films. At most
        5 changes/minute and 20/24 hours across all review write routes.'
      parameters:
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedReview'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedReview'
          description: ''
    delete:
      operationId: v1_ratings_reviews_mine_destroy
      description: Remove your written review while retaining your star rating. Counts
        toward review write limits.
      parameters:
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/ratings/watchlist/:
    get:
      operationId: v1_ratings_watchlist_list
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 60
          minimum: 1
          default: 20
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWatchlistList'
          description: ''
  /api/v1/ratings/watchlist/{tmdb_id}/:
    get:
      operationId: v1_ratings_watchlist_retrieve
      parameters:
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
          description: ''
    put:
      operationId: v1_ratings_watchlist_update
      description: Idempotently add this TMDB movie to your watchlist; no request
        body.
      parameters:
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
          description: ''
    delete:
      operationId: v1_ratings_watchlist_destroy
      parameters:
      - in: path
        name: tmdb_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/recommendations/:
    get:
      operationId: v1_recommendations_retrieve
      description: Rank unrated catalog films for the signed-in user. Watchlisted
        films are excluded by default. Scores are relative ranking signals, not probabilities.
        Missing model coverage is represented by null, with weights redistributed
        over available components.
      parameters:
      - in: query
        name: exclude_watchlist
        schema:
          type: boolean
          default: true
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: refresh_seed
        schema:
          type: string
          maxLength: 128
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
          description: ''
  /api/v1/users/csrf/:
    get:
      operationId: v1_users_csrf_retrieve
      description: Sets the CSRF cookie. Send csrf_token in X-CSRFToken with every
        unsafe request and include session cookies.
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
